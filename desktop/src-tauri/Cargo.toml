[package]
name = "architectos"
version = "1.0.0"
description = "ArchitectOS desktop interface"
edition = "2021"

# Minimum Rust this crate's own source requires.
#
# Important: on Cargo < 1.85 this does NOT constrain dependency
# resolution. Older Cargo has no MSRV-aware resolver and will select the
# newest semver-compatible transitive crates regardless of their declared
# rust-version. That is exactly how an edition-2024 crate ended up in an
# edition-2021 project. See rust-toolchain.toml.
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
